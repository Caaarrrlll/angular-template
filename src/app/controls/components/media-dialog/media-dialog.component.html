<button type="button" class="closeButton" aria-label="Close" (click)="close()">
	<mat-icon>close</mat-icon>
</button>
@if (imageData$ | apiResponse | async; as imageData) {
	@let src = mediaSrc(imageData);
	@if (imageData.loading) {
		<app-loader [fontSize]="60"></app-loader>
	} @else if (src) {
		<div class="image-container">
			<img [src]="src" class="image" alt="Media item" />
		</div>
	} @else {
		<span class="no-data">No images available</span>
	}
}
