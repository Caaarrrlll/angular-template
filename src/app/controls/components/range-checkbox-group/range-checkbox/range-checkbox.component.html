<button type="button" class="checkbox-wrapper" mat-button (click)="checkBoxGroup.toggleValue(value())">
	<div class="inner-wrapper">
		<div class="label">
			<ng-content></ng-content>
		</div>
		<div class="checkbox">
			<mat-checkbox tabindex="-1" [checked]="checkBoxGroup.isSelected(value())"></mat-checkbox>
		</div>
	</div>
</button>
