@if (displayLength >= 29) {
	<div>Button name '{{ type.display }}' is to long, stopping. The button name must be less than 29. Please fix your code</div>
} @else {
	@if (displayLength === 0) {
		<button
			[disabled]="type.disabled"
			(click)="onClick(type.value, $event)"
			class="icon-button-container icon-container"
			[class]="buttonClass"
			[matTooltip]="type.tooltip"
		>
			@if (type.loading) {
				<app-loader></app-loader>
			} @else {
				<div class="icon-container" style="width: 20px; height: 20px; padding-right: 3px">
					<mat-icon>{{ type.icon }}</mat-icon>
				</div>
			}
		</button>
	} @else {
		<button
			[class]="buttonClass"
			[disabled]="type.disabled"
			(click)="onClick(type.value)"
			class="button-container button-width-ext"
			style="--button-padding: {{ buttonPadding }}; --font-size: {{ buttonFontSize }}; --button-height: {{ buttonHeight }}; --button-width: {{ type.width }}; font-family: Poppins, sans-serif"
			[matTooltip]="type.tooltip"
		>
			@if (type.icon && type.iconSide == "left" && !type.loading) {
				<div class="icon-container" style="padding-left: 4px">
					<mat-icon>{{ type.icon }}</mat-icon>
				</div>
				@if (displayLength > 0) {
					<div [style]="{ 'padding-left': type.isTableButton ? '4px' : '8px', 'padding-right': type.isTableButton ? '4px' : '8px' }">
						{{ type.display.toUpperCase() }}
					</div>
				}
			} @else if (type.icon && type.iconSide == "right" && !type.loading) {
				@if (displayLength > 0) {
					<div [style]="{ 'padding-left': type.isTableButton ? '4px' : '8px', 'padding-right': type.isTableButton ? '4px' : '8px' }">
						{{ type.display.toUpperCase() }}
					</div>
				}
				<div class="icon-container" style="padding-right: 4px">
					<mat-icon>{{ type.icon }}</mat-icon>
				</div>
			} @else if (displayLength > 0 && !type.iconSide && !type.loading) {
				<div [style]="{ 'padding-left': type.isTableButton ? '4px' : '8px', 'padding-right': type.isTableButton ? '4px' : '8px' }">
					{{ type.display.toUpperCase() }}
				</div>
			}
			@if (type.loading) {
				<app-loader></app-loader>
			}
		</button>
	}
}
