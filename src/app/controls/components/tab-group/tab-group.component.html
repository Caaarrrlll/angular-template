<mat-tab-group
	class="tab-group__tabs"
	dynamicHeight
	[(selectedIndex)]="tabToUse"
	[class]="tabList().tabType"
	[style]="matTabGroupConfig()"
	(selectedTabChange)="tabButtonClick($event)">
	@for (item of tabList().tab; track item.index; let i = $index) {
		<mat-tab [label]="item.tabName" [disabled]="!item.isProcess ? false : item.canProgress ? false : true">
			<ng-template mat-tab-label>
				@if (item.icon) {
					<mat-icon class="tab-group__icon">{{ item.icon }}</mat-icon>
				}
				<div [style]="{ 'font-size': tabList().fontSize }">{{ item.tabName }}</div>
			</ng-template>

			@if (tabList().tabType === "vertical") {
				<div class="tab-group__vertical-header" [style]="{ 'background-color': tabList().tabLabelBackgroundColor, 'font-size': tabList().fontSize }">
					<div class="tab-group__center">
						<b>{{ item.tabName }}</b>
					</div>
				</div>
			}
			@if (templatesByKey().get(item.classSelect); as content) {
				<ng-container [ngTemplateOutlet]="content"></ng-container>
			} @else if (i === tabToUse()) {
				<!-- Fallback for consumers that project plain content (no appTabGroupContent templates): shown for the selected tab. -->
				<ng-content></ng-content>
			}
		</mat-tab>
	}
</mat-tab-group>
