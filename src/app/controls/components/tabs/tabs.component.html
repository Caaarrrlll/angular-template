<div style="display: flex; height: 100%">
	<div style="display: flex; flex-direction: column; width: 150px" class="hide-lt-md">
		<div class="tabs-container">
			<ul>
				@for (tab of tabs; track tab; let i = $index) {
					<li [ngClass]="{ active: tab.active }" (click)="selectTab(tab)">
						@if (tab.completed) {
							<mat-icon>check_circle_outline</mat-icon>
						}
						<p>{{ i + 1 }}</p>
						{{ tab.title }}
					</li>
				}
			</ul>
		</div>
	</div>

	<div class="small-tabs-container" class="hide-gt-sm">
		<ul>
			@for (tab of tabs; track tab; let i = $index) {
				<li [ngClass]="{ active: tab.active }" (click)="selectTab(tab)">
					@if (tab.completed) {
						<mat-icon>check_circle_outline</mat-icon>
					}
					@if (!tab.completed) {
						<p>{{ i + 1 }}</p>
					}
				</li>
			}
		</ul>
	</div>
	<div style="width: 100%">
		<ng-content></ng-content>
	</div>
</div>
