<mat-form-field appearance="fill">
	<mat-label>{{ label }}</mat-label>
	<input
		[type]="isTextNumber ? 'text' : 'number'"
		(keyup)="checkInput($event)"
		[formControl]="inputControl.inputControl"
		matInput
		[placeholder]="placeholder"
		[readonly]="isReadOnly"
	/>
	@if (action) {
		<button mat-button class="button-wrapper" [title]="action.tooltip" (click)="buttonClick(action.value, action.parameters)">
			<mat-icon class="button-icon">{{ action.icon }}</mat-icon>
		</button>
	}
	@if (inputControl.inputControl.value && inputControl.clear && !isReadOnly) {
		<button mat-icon-button class="button-wrapper" matSuffix aria-label="Clear" (click)="inputControl.inputControl.reset()">
			<mat-icon>close</mat-icon>
		</button>
	}
	@for (error of inputControl.errors; track error.name) {
		@if (inputControl.inputControl.hasError(error.name)) {
			<mat-error>{{ error.message }}</mat-error>
		}
	}
</mat-form-field>
