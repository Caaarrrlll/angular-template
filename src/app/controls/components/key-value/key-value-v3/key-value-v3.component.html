<div class="kv-container-row" [class.right]="alignRight" [style.paddingBottom]="bottomPadding">
	@if (key) {
		<div class="key flex-row-wrap row-start" [class.bold]="!boldValue" [title]="keyTitle ?? ``">{{ key }}{{ colon ? `:` : `` }}</div>
	}
	<div class="value flex-row-wrap row-end" [class.bold]="boldValue" [title]="title ?? ``">
		@if (showEdit) {
			<mat-icon (click)="editField()" class="show-pointer icon-size">edit</mat-icon>
		}
		@if (showView) {
			<mat-icon (click)="viewField()" class="show-pointer icon-size">visibility</mat-icon>
		}
		{{ value }}
	</div>
</div>
