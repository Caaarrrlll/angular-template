<div class="container" appDragAndDropFiles (fileDropped)="handleFilesDropped($event)">
	@if (!isInDialog()) {
		<div class="exit" role="button" tabindex="0" (click)="onClose()" (keydown.enter)="onClose()">
			<mat-icon>close</mat-icon>
		</div>
	}

	<div>
		@if (files().length > 0) {
			<div class="uploaded-files">
				<div class="s-c-orange-mb-10">Attached files</div>
				@for (file of files(); track file) {
					<div>{{ file.name }}</div>
				}
			</div>
		}

		<div>
			<input type="file" [id]="inputId" #fileDropRef multiple [accept]="filesToAccept() ?? ''" (change)="handleFilesDropped(fileDropRef.files)" />
			<mat-icon>description</mat-icon>
			<h3>Drag and drop file here</h3>
			<h3>or</h3>
			<label [for]="inputId">Browse for file</label>
		</div>
	</div>
</div>
