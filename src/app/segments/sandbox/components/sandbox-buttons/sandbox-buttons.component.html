<app-sandbox-page title="Buttons" description="button (every CustButtonType), button-toggle and fab-button demos.">
	<app-sandbox-demo
		title="Button v2 - variants"
		description="One button per CustButtonType. The toggles drive the disabled, loading and isTableButton inputs on every button; buttonClick is logged."
		[log]="buttonLog.entries()">
		<div class="sandbox-buttons__controls">
			<label><input type="checkbox" [checked]="disabled()" (change)="disabled.set(!disabled())" /> disabled</label>
			<label><input type="checkbox" [checked]="loading()" (change)="loading.set(!loading())" /> loading</label>
			<label><input type="checkbox" [checked]="tableSize()" (change)="tableSize.set(!tableSize())" /> isTableButton</label>
		</div>
		<div class="sandbox-buttons__row">
			@for (button of variantButtons(); track button.value) {
				<app-button [type]="button" (buttonClick)="onButtonClick($event)"></app-button>
			}
		</div>
	</app-sandbox-demo>

	<app-sandbox-demo
		title="Button v2 - icons and width"
		description="Icon left/right, a fixed width, and an icon-only button (empty display). Shares the toggles above."
		[log]="buttonLog.entries()">
		<div class="sandbox-buttons__row">
			@for (button of iconButtons(); track button.value) {
				<app-button [type]="button" (buttonClick)="onButtonClick($event)"></app-button>
			}
		</div>
	</app-sandbox-demo>

	<app-sandbox-demo title="Button v2 - label too long" description="Labels of 29+ characters render a validation message instead of the button.">
		<app-button [type]="tooLongButton"></app-button>
	</app-sandbox-demo>

	<app-sandbox-demo title="Button toggle" description="Single select, multi select, read only and equalToSelected; inputChanged is logged." [log]="toggleLog.entries()">
		<div class="sandbox-buttons__grid">
			<app-button-toggle [inputObj]="singleToggle" (inputChanged)="onToggleChanged('single', $event)"></app-button-toggle>
			<app-button-toggle [inputObj]="multiToggle" (inputChanged)="onToggleChanged('multi', $event)"></app-button-toggle>
			<app-button-toggle [inputObj]="readOnlyToggle" (inputChanged)="onToggleChanged('read-only', $event)"></app-button-toggle>
			<app-button-toggle [inputObj]="operatorToggle" [equalToSelected]="true" (inputChanged)="onToggleChanged('operator', $event)"></app-button-toggle>
		</div>
	</app-sandbox-demo>

	<app-sandbox-demo
		title="FAB button"
		description="By default (floating) the FAB is position: fixed, so each stage below contains it. Left: defaults. Right: custom icon/ariaLabel with floating = false (inline). emitClick is logged."
		[log]="fabLog.entries()">
		<div class="sandbox-buttons__controls">
			@for (icon of fabIcons; track icon) {
				<button type="button" [disabled]="fabIcon() === icon" (click)="fabIcon.set(icon)">icon: {{ icon }}</button>
			}
		</div>
		<div class="sandbox-buttons__row">
			<div class="sandbox-buttons__fab-stage">
				<span>Defaults</span>
				<app-fab-button (emitClick)="onFabClick('default')"></app-fab-button>
			</div>
			<div class="sandbox-buttons__fab-stage">
				<span>icon: {{ fabIcon() }}, floating: false</span>
				<app-fab-button [icon]="fabIcon()" [ariaLabel]="fabIcon()" [floating]="false" (emitClick)="onFabClick(fabIcon())"></app-fab-button>
			</div>
		</div>
	</app-sandbox-demo>
</app-sandbox-page>
