<section class="sandbox">
	<header class="sandbox__header">
		<h1>Sandbox</h1>
		<p>Dev-only demos for every control in the template. Each family page covers inputs, outputs and visual states with deterministic mock data kept in memory only.</p>
	</header>

	<nav class="sandbox__grid">
		@for (family of families; track family.path) {
			<a class="sandbox__card" [routerLink]="['/sandbox', family.path]">
				<h2>{{ family.title }}</h2>
				<p>{{ family.description }}</p>
			</a>
		}
	</nav>
</section>
