<section class="accordion">
	<div *ngFor="let item of items; index as i" class="accordion__item" [class.disabled]="item.disabled" [class.active]="expanded.has(i)">
		<ng-container [ngTemplateOutlet]="item?.customHeader?.templateRef || defaultHeader" [ngTemplateOutletContext]="{ $implicit: item, index: i, toggle: getToggleState(i) }">
		</ng-container>
		<div class="accordion__content" [@contentExpansion]="expanded.has(i) ? 'expanded' : 'collapsed'">
			<ng-container *ngTemplateOutlet="item?.content?.templateRef"></ng-container>
		</div>
	</div>
</section>

<ng-template #defaultHeader let-item let-index="index">
	<header class="accordion__header" (click)="item.disabled ? {} : toggleState(index)">
		<button class="accordion__toggle-btn" [disabled]="item.disabled"></button>
	</header>
</ng-template>
