<kendo-formfield *ngIf="!material">
	<kendo-floatinglabel [text]="labelText" [ngStyle]="{ width: width }">
		<input
			kendoTextBox
			#mapSearchField
			(keydown.enter)="allowManualInput ? null : $event.preventDefault()"
			[placeholder]="labelText"
			autocorrect="off"
			type="search"
			autocapitalize="off"
			spellcheck="off"
			[disabled]="disabled"
			[value]="value"
			(input)="allowManualInput ? manualUpdateAddress.emit($event.target.value) : null"
		/>
	</kendo-floatinglabel>
</kendo-formfield>

<mat-form-field *ngIf="material">
	<mat-label>{{ labelText }}</mat-label>

	<input
		[ngStyle]="{ width: width }"
		matInput
		#mapSearchField
		(keydown.enter)="allowManualInput ? null : $event.preventDefault()"
		[placeholder]="labelText"
		autocorrect="off"
		type="search"
		autocapitalize="off"
		spellcheck="off"
		[disabled]="disabled"
		[value]="value"
		(input)="allowManualInput ? manualUpdateAddress.emit($event.target.value) : null"
	/>
</mat-form-field>
