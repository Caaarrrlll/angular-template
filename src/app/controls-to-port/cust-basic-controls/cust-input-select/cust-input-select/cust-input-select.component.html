<mat-form-field appearance="fill">
	<mat-label>{{ inputObj.label }}</mat-label>
	<mat-select [disabled]="inputObj.isReadOnly" [formControl]="inputControl" (ngModelChange)="onClick($event)">
		<mat-option *ngFor="let option of this.inputObj.inputList" value="{{ option.value }}">
			{{ option.display }}
		</mat-option>
	</mat-select>
</mat-form-field>
