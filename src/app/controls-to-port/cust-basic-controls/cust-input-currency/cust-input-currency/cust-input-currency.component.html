<mat-form-field appearance="fill">
	<input type="money" [formControl]="inputControl.inputControl" matInput placeholder="{{ placeholder }}" [readonly]="isReadOnly" />
	<span matPrefix *ngIf="inputControl.inputControl.value" class="currency-spacing">{{ currencySymbol }}</span>
	<mat-label class="label">{{ label }}</mat-label>

	<button *ngIf="action != undefined" mat-button matSuffix class="button-wrapper" [title]="action.tooltip" (click)="buttonClick(action.value, action.parameters)">
		<mat-icon class="button-icon">{{ action.icon }}</mat-icon>
	</button>
	<button
		mat-button
		*ngIf="inputControl.inputControl.value && inputControl.clear && !isReadOnly"
		class="button-wrapper"
		matSuffix
		mat-icon-button
		aria-label="Clear"
		(click)="inputControl.inputControl.reset()"
	>
		<mat-icon>close</mat-icon>
	</button>

	<mat-error *ngFor="let error of inputControl.errors">
		<ng-container *ngIf="inputControl.inputControl.hasError(error.name)">{{ error.message }}</ng-container>
	</mat-error>
</mat-form-field>
