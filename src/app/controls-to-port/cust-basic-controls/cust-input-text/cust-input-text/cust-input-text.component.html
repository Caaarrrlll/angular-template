<mat-form-field appearance="fill" *ngIf="action == undefined || action?.value != 'calendar'">
	<mat-label>{{ label }}</mat-label>
	<input
		*ngIf="action == undefined || action?.value != 'calendar'"
		type="text"
		[formControl]="inputControl.inputControl"
		matInput
		[placeholder]="placeholder"
		[readonly]="isReadOnly"
		[maxlength]="inputControl.maxlen"
	/>
	<button *ngIf="action != undefined" mat-button matSuffix class="button-wrapper" [title]="action.tooltip" (click)="buttonClick(action.value, action.parameters)">
		<mat-icon class="button-icon">{{ action.icon }}</mat-icon>
	</button>
	<button
		mat-button
		*ngIf="inputControl.inputControl.value && inputControl.clear && !isReadOnly"
		class="button-wrapper"
		matSuffix
		mat-icon-button
		aria-label="Clear"
		(click)="inputControl.inputControl.reset()"
	>
		<mat-icon>close</mat-icon>
	</button>
	<mat-error *ngFor="let error of inputControl.errors">
		<ng-container *ngIf="inputControl.inputControl.hasError(error.name)">{{ error.message }}</ng-container>
	</mat-error>
</mat-form-field>

<mat-form-field appearance="fill" *ngIf="action?.value == 'calendar'">
	<mat-label>{{ label }}</mat-label>
	<input matInput [matDatepicker]="picker" [formControl]="inputControl.inputControl" (dateChange)="dateChange()" />
	<button mat-button class="button-wrapper" matSuffix mat-icon-button aria-label="picker">
		<mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
	</button>
	<mat-datepicker #picker></mat-datepicker>
</mat-form-field>
